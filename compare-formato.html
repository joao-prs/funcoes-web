<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comparador de Formatos</title>
<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:Arial, Helvetica, sans-serif;
    }
    body{
        background:#111;
        color:white;
        height:100vh;
        overflow:hidden;
    }
    .container{
        display:grid;
        grid-template-columns: 340px 1fr;
        height:100vh;
    }
    /* COLUNA ESQUERDA */
    .sidebar{
        background:#1b1b1b;
        border-right:1px solid #333;
        padding:20px;
        overflow:auto;
    }
    .sidebar h1{
        font-size:22px;
        margin-bottom:20px;
    }
    .inputs{
        display:flex;
        gap:10px;
        margin-bottom:10px;
    }
    input{
        width:100%;
        padding:10px;
        border:none;
        border-radius:8px;
        background:#2b2b2b;
        color:white;
        font-size:15px;
    }
    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:#4f7cff;
        color:white;
        font-weight:bold;
        cursor:pointer;
        transition:0.2s;
    }
    button:hover{
        opacity:0.9;
    }
    .list{
        margin-top:20px;
        display:flex;
        flex-direction:column;
        gap:10px;
    }
    .item{
        background:#242424;
        border-radius:10px;
        padding:10px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        border-left:6px solid white;
    }
    .item-info{
        display:flex;
        flex-direction:column;
        gap:4px;
    }
    .ratio{
        font-weight:bold;
        font-size:16px;
    }
    .resolution{
        opacity:0.7;
        font-size:13px;
    }
    .remove-btn{
        width:auto;
        background:#ff4b4b;
        padding:8px 12px;
        font-size:13px;
    }
    /* COLUNA DIREITA */
    .viewer{
        display:flex;
        align-items:center;
        justify-content:center;
        position:relative;
        overflow:hidden;
    }
    .circle{
        width:min(720px, 90vw);
        aspect-ratio:1 / 1;
        border:3px solid rgba(255,255,255,0.05);
        border-radius:50%;
        position:relative;
        z-index:1;
        flex-shrink:0;
    }
    .shape{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        border:2px solid;
        backdrop-filter: blur(1px);
        /* destaque dos retângulos */
        z-index:5;
    }
    @media(max-width:900px){
        body{
            overflow:auto;
        }
        .container{
            grid-template-columns:1fr;
            grid-template-rows:auto auto;
            height:auto;
        }
        .viewer{
            min-height:800px;
            padding:30px;
        }
        .circle{
            width:90vw;
            height:90vw;
        }
    }
</style>
</head>
<body>
<div class="container">
    <!-- COLUNA ESQUERDA -->
    <div class="sidebar">
        <h1>Comparador de Formatos</h1>
        <div class="inputs">
            <input type="number" id="widthInput" placeholder="Largura" />
            <input type="number" id="heightInput" placeholder="Altura" />
        </div>
        <button onclick="addFormat()">
            Adicionar
        </button>
        <div class="list" id="list"></div>
    </div>
    <!-- COLUNA DIREITA -->
    <div class="viewer">
        <div class="circle" id="circle"> </div>
    </div>
</div>
<script>
const formats = [];
function randomColor(){
    const hue = Math.floor(Math.random() * 360);
    return `hsl(${hue}, 90%, 60%)`;
}
function gcd(a, b){
    return b === 0 ? a : gcd(b, a % b);
}
function addFormat(){
    const width = parseFloat(document.getElementById("widthInput").value);
    const height = parseFloat(document.getElementById("heightInput").value);
    if(!width || !height){
        alert("Informe largura e altura.");
        return;
    }
    const divisor = gcd(width, height);
    const ratioW = width / divisor;
    const ratioH = height / divisor;
    const ratio = `${ratioW}:${ratioH}`;
    const color = randomColor();
    const item = {
        id: Date.now(),
        width,
        height,
        ratio,
        color
    };
    formats.push(item);
    render();
}
function removeFormat(id){
    const index = formats.findIndex(f => f.id === id);
    if(index !== -1){
        formats.splice(index, 1);
    }
    render();
}
function render(){
    renderList();
    renderShapes();
}
function renderList(){
    const list = document.getElementById("list");
    list.innerHTML = "";
    formats.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.style.borderLeftColor = item.color;
        div.innerHTML = `
            <div class="item-info">
                <div class="ratio" style="color:${item.color}">
                    ${item.ratio}
                </div>

                <div class="resolution">
                    ${item.width} × ${item.height}
                </div>
            </div>
            <button class="remove-btn"
                onclick="removeFormat(${item.id})">
                Remover
            </button>
        `;
        list.appendChild(div);
    });
}
function renderShapes(){
    const circle = document.getElementById("circle");
    // remove apenas shapes antigos
    document.querySelectorAll(".shape").forEach(e => e.remove());
    const circleSize = circle.clientWidth;
    const radius = circleSize / 2;
    /*
        cálculo do encaixe perfeito:
        diagonal do retângulo = diâmetro do círculo
        escala = diâmetro / diagonal
    */
    formats.forEach(item => {
        const rect = document.createElement("div");
        rect.className = "shape";
        const diagonal = Math.sqrt(
            item.width * item.width +
            item.height * item.height
        );
        const scale = (radius * 2) / diagonal;
        const rectWidth = item.width * scale;
        const rectHeight = item.height * scale;
        rect.style.width = rectWidth + "px";
        rect.style.height = rectHeight + "px";
        rect.style.borderColor = item.color;
        /* transparência entre 20% e 30% */
        rect.style.background = item.color.replace("hsl", "hsla")
            .replace(")", ", 0.25)");
        circle.appendChild(rect);
    });
}
window.addEventListener("resize", renderShapes);
document.querySelectorAll("input").forEach(input => {
    input.addEventListener("keydown", function(event){
        if(event.key === "Enter"){
            addFormat();
        }
    });
});
</script>
</body>
</html>
